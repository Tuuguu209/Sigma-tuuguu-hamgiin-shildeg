<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ program.name }} | Их Засаг Политехник Коллеж</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a class="logo program-link" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='Images/school.jpg') }}" alt="" class="logo-img">
                <div class="logo-text">
                    <h1>ИХ ЗАСАГ</h1>
                    <p>ПОЛИТЕХНИК КОЛЛЕЖ</p>
                </div>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="{{ url_for('index') }}">Нүүр</a></li>
                    <li><a href="{{ url_for('hutulbur') }}">Бүх хөтөлбөр</a></li>
                    <li><a href="{{ url_for('index') }}#register" class="btn-nav">Элсэх хүсэлт</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="section-header">
            <div class="card-icon" aria-hidden="true">{{ program.icon }}</div>
            <h2 class="section-title">{{ program.name }}</h2>
            <p class="section-subtitle">{{ program.description }}</p>
        </div>
        <div class="register-form">
            <p>{{ program.description }}</p>
            <p style="margin-top: 20px;">
                Элсэлтийн хүсэлт илгээж, хөтөлбөрийн талаар дэлгэрэнгүй мэдээлэл аваарай.
            </p>
            <a href="{{ url_for('index') }}#register" class="btn btn-primary" style="margin-top: 20px;">
                Элсэх хүсэлт өгөх
            </a>
            <a href="{{ url_for('hutulbur') }}" class="btn btn-secondary" style="margin-top: 20px; color: #134074; border-color: #134074;">
                Бүх хөтөлбөр харах
            </a>
        </div>
    </main>
</body>
</html>
